<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>协作导入与检查实验</title>
<style>
:root{font:16px system-ui,-apple-system,sans-serif;color:#17243b;background:#f3f6fb}body{max-width:1100px;margin:32px auto;padding:0 20px}h1{font-size:28px;margin:8px 0}h2{font-size:19px}.muted{color:#63718a;font-size:14px}.pill{display:inline-block;padding:5px 11px;border-radius:20px;background:#dce8fc;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{background:white;border:1px solid #dae2ef;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 3px 12px #22335505}label{display:flex;justify-content:space-between;gap:10px;margin:14px 0;align-items:center}input[type=number]{width:95px;border:1px solid #bbc8dc;padding:8px;border-radius:6px;font:inherit}button{background:#255ec4;border:0;color:white;padding:10px 15px;border-radius:7px;font:inherit;cursor:pointer;margin:4px 7px 0 0}button.secondary{background:#e8eef8;color:#25446e}button.danger{background:#9b3544}button:disabled{opacity:.4;cursor:not-allowed}.message{min-height:24px;color:#8e3340}.ok{color:#237150}svg{width:100%;max-width:440px;background:#f8fafd;border-radius:10px}.small{font-size:13px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;border-bottom:1px solid #e2e9f3;padding:9px}details{margin-top:15px}a{color:#255ec4}code{font-size:13px}#status{white-space:nowrap}select{padding:8px;font:inherit;border:1px solid #bbc8dc;border-radius:6px}
</style>
<div class="top"><div><span class="pill">受控协作案例 · 本地记录</span><h1>发布、导入、检查</h1><p class="muted">四个分区，三个专业。提交实际修改，协作解决净空和连接问题。</p></div><div id="status" class="pill">正在连接</div></div>
<div id="notice" class="card">请使用主持人终端打印的专业角色链接。</div>
<div id="dashboard" hidden>
 <div class="card"><div class="top"><strong id="role"></strong><span id="clock"></span></div><p id="summary" class="muted"></p><div id="admin" hidden>
 <label>参加人数（同一团队）<select id="people"><option value="3">3人</option><option value="2">2人</option></select></label>
 <label style="justify-content:flex-start"><input id="consent" type="checkbox">已向参与者说明记录内容，确认自愿参加</label>
 <button id="start" onclick="startStudy()">开始本次实验</button><button class="secondary" onclick="card(1)">已发需求卡1</button><button class="secondary" onclick="card(2)">已发需求卡2</button><button class="secondary" onclick="card(3)">已发需求卡3</button><button class="danger" onclick="stopStudy()">提前终止并保留记录</button>
 <p class="muted">先阅读执行手册。正式场次中，请勿告诉参与者哪个策略表现更好。需求卡释放约在3、7、11分钟，并点击相应按钮记录。</p></div><p id="global-message" class="message"></p></div>
 <div id="editors" class="grid"></div>
 <div class="card"><h2>已发布模型的示意</h2><p class="muted">单位：米。图为数值原型的剖面示意；蓝色风管应位于开口内，并低于梁底与吊顶。不是BIM模型或规范验算。</p><select id="zone" onchange="draw()"><option>A</option><option>B</option><option>C</option><option>D</option></select><div id="drawing"></div></div>
 <div id="review" class="card" hidden><h2>最近一次本地缓存检查</h2><p class="muted">版本新鲜度与检查结论分别记录。检查由服务器在导入后执行，不触发补取。</p><div id="review-results"></div></div>
</div>
<script>
const token=new URLSearchParams(location.search).get('token')||'';
const roleNames={architecture:'建筑专业',structure:'结构专业',mep:'机电专业',coordinator:'主持人'};
const fieldNames={opening_center:'开口中心偏移',opening_width:'开口宽度',ceiling:'吊顶高度',beam_bottom:'梁底高度',duct_center:'风管中心偏移',duct_width:'风管宽度',duct_top:'风管顶部高度'};
let state=null,ready=false,bases={};
async function api(path,data){let r=await fetch('/api/'+path+'?token='+encodeURIComponent(token),data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});let j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j;}
function message(text){document.getElementById('global-message').textContent=text;}
function loadForm(key){let obj=state.models[key];bases[key]=obj.version;for(let [field,value] of Object.entries(obj.payload))document.getElementById(key+'_'+field).value=value;document.getElementById(key+'_version').textContent='编辑基于版本 '+obj.version;document.getElementById(key+'_message').textContent='已加载已发布版本';}
async function publish(key){try{let payload={};for(let field of Object.keys(state.models[key].payload))payload[field]=Number(document.getElementById(key+'_'+field).value);let r=await api('publish',{file_id:key,expected_version:bases[key],payload});bases[key]=r.version;document.getElementById(key+'_version').textContent='编辑基于版本 '+r.version;document.getElementById(key+'_message').textContent='已发布版本 '+r.version;await poll();}catch(e){document.getElementById(key+'_message').textContent=e.message;}}
function setup(){document.getElementById('notice').hidden=true;document.getElementById('dashboard').hidden=false;document.getElementById('role').textContent=roleNames[state.role];document.getElementById('admin').hidden=state.role!=='coordinator';document.getElementById('review').hidden=state.role!=='coordinator';if(state.role!=='coordinator'){let html='';for(let z of ['A','B','C','D']){let key=z+'_'+state.role;html+='<section class="card"><h2>分区 '+z+'</h2><p id="'+key+'_version" class="muted"></p>';for(let [f,[lo,hi]] of Object.entries(state.fields[state.role]))html+='<label>'+fieldNames[f]+'<input type="number" step="0.05" min="'+lo+'" max="'+hi+'" id="'+key+'_'+f+'"></label>';html+='<button onclick="publish(\''+key+'\')">发布修改</button><button class="secondary" onclick="loadForm(\''+key+'\')">重新加载</button><p id="'+key+'_message" class="message small"></p></section>';}document.getElementById('editors').innerHTML=html;for(let z of ['A','B','C','D'])loadForm(z+'_'+state.role);}ready=true;}
function draw(){if(!state)return;let z=document.getElementById('zone').value,a=state.models[z+'_architecture'].payload,s=state.models[z+'_structure'].payload,m=state.models[z+'_mep'].payload;let x=v=>220+70*v,y=v=>345-65*v;document.getElementById('drawing').innerHTML='<svg viewBox="0 0 440 370" role="img" aria-label="开口与风管剖面示意"><rect x="35" y="20" width="370" height="325" fill="#e1e7ef"/><rect x="'+x(a.opening_center-a.opening_width/2)+'" y="35" width="'+(70*a.opening_width)+'" height="310" fill="white"/><line x1="35" x2="405" y1="'+y(a.ceiling)+'" y2="'+y(a.ceiling)+'" stroke="#a07c37" stroke-width="3"/><line x1="35" x2="405" y1="'+y(s.beam_bottom)+'" y2="'+y(s.beam_bottom)+'" stroke="#6b7280" stroke-dasharray="6 3" stroke-width="3"/><rect x="'+x(m.duct_center-m.duct_width/2)+'" y="'+y(m.duct_top)+'" width="'+(70*m.duct_width)+'" height="30" fill="#3a79d8" opacity=".85"/><text x="35" y="363" fill="#5d6e88" font-size="12">实线：吊顶 · 虚线：梁底 · 蓝色：风管</text></svg>';}
async function poll(){try{state=await api('state');if(!ready)setup();document.getElementById('status').textContent=state.mode+' / '+state.status;let sec=Math.floor(state.elapsed);document.getElementById('clock').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');document.getElementById('summary').textContent='已发布 '+state.publications+' 次 · 已导入 '+state.gates+'/'+state.protocol.windows+' 轮 · 已检查 '+state.checks+' 轮'+(state.next_gate!==null?' · 下次计划导入 '+Math.max(0,Math.ceil(state.next_gate-state.elapsed))+' 秒后':'');document.querySelectorAll('#editors button').forEach(b=>b.disabled=state.status!=='RUNNING');document.getElementById('start').disabled=state.status!=='READY';if(state.last_checks)document.getElementById('review-results').innerHTML='<table><tr><th>检查</th><th>输入版本当前</th><th>缓存结论</th><th>当前源结论</th></tr>'+state.last_checks.map(t=>'<tr><td>'+t.task+'</td><td>'+(t.fresh?'是':'否')+'</td><td>'+(t.cached_check.pass?'通过':t.cached_check.issues.join(', '))+'</td><td>'+(t.current_check.pass?'通过':t.current_check.issues.join(', '))+'</td></tr>').join('')+'</table>';draw();}catch(e){if(!ready)document.getElementById('notice').textContent=e.message;else message(e.message);}}
async function startStudy(){try{await api('start',{participant_count:Number(document.getElementById('people').value),confirmed:document.getElementById('consent').checked});message('已开始。先按手册完成3分钟熟悉与预热。');await poll();}catch(e){message(e.message);}}
async function card(n){try{await api('card',{card:n});message('已记录需求卡 '+n+' 的实际发放时间');}catch(e){message(e.message);}}
async function stopStudy(){if(!confirm('提前终止会保留全部原始记录，并标记为未完成。继续？'))return;try{await api('stop',{});await poll();}catch(e){message(e.message);}}
poll();setInterval(poll,1500);
</script></html>
